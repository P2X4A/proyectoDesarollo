<div class="ml-form-page py-5">
  <div class="container ml-form-container bg-white p-4 p-md-5 rounded shadow-sm">
    <h2 class="mb-4 fw-bold text-dark">Publicar nuevo producto</h2>
    
    <form (ngSubmit)="onSubmit()" #productoForm="ngForm">
      
      <!-- Nombre -->
      <div class="mb-4">
        <label for="nombre" class="form-label fw-semibold">Título de tu publicación <span class="text-danger">*</span></label>
        <input type="text" class="form-control form-control-lg ml-input" id="nombre" name="nombre" [(ngModel)]="producto.nombre" required placeholder="Ej: Celular Samsung Galaxy S23">
      </div>

      <!-- Precio y Categoría -->
      <div class="row mb-4">
        <div class="col-md-6 mb-4 mb-md-0">
          <label for="precio" class="form-label fw-semibold">Precio (COP) <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-light">$</span>
            <input type="number" class="form-control form-control-lg ml-input" id="precio" name="precio" [(ngModel)]="producto.precio" required min="0" placeholder="0">
          </div>
        </div>
        <div class="col-md-6">
          <label for="categoria" class="form-label fw-semibold">Categoría <span class="text-danger">*</span></label>
          <select class="form-select form-select-lg ml-input" id="categoria" name="categoria" [(ngModel)]="producto.categoria" required>
            <option value="" disabled selected>Selecciona una categoría</option>
            <option value="Tecnología">Tecnología</option>
            <option value="Hogar">Hogar</option>
            <option value="Vehículos">Vehículos</option>
            <option value="Deportes">Deportes</option>
            <option value="Moda">Moda</option>
            <option value="Otros">Otros</option>
          </select>
        </div>
      </div>

      <!-- Descripción -->
      <div class="mb-4">
        <label for="descripcion" class="form-label fw-semibold">Descripción <span class="text-danger">*</span></label>
        <textarea class="form-control ml-input" id="descripcion" name="descripcion" [(ngModel)]="producto.descripcion" required rows="4" placeholder="Describe las características principales de tu producto..."></textarea>
      </div>

      <!-- Imagen URL -->
      <div class="mb-4">
        <label for="imagen" class="form-label fw-semibold">URL de la imagen</label>
        <input type="url" class="form-control ml-input" id="imagen" name="imagen" [(ngModel)]="producto.imagen" placeholder="https://ejemplo.com/imagen.jpg">
      </div>

      <!-- Botones -->
      <div class="d-flex gap-3 justify-content-end mt-5">
        <button type="button" class="btn btn-link text-decoration-none fw-semibold" style="color: rgb(52, 131, 250);" routerLink="/">Cancelar</button>
        <button type="submit" class="btn btn-primary btn-lg ml-btn-primary px-5 fw-bold" [disabled]="!productoForm.valid">Publicar</button>
      </div>

    </form>
  </div>
</div>
