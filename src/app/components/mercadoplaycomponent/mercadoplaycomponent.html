<div class="ml-play-page text-white">
  <!-- Hero Banner Play -->
  <div class="ml-play-hero d-flex align-items-center justify-content-center text-center p-5">
    <div class="animate__animated animate__zoomIn">
      <i class="fa-solid fa-play fa-4x mb-3 text-info"></i>
      <h1 class="display-4 fw-bold">Mercado Play</h1>
      <p class="fs-5"><i class="fa-solid fa-ticket me-1"></i>Disfruta del mejor entretenimiento sin costo adicional.</p>
      <button class="btn btn-info btn-lg mt-3 text-dark fw-bold px-5 rounded-pill"><i class="fa-regular fa-circle-play me-2"></i>Explorar Catálogo</button>
    </div>
  </div>

  <!-- Carrusel de Películas -->
  <div class="container py-5">
    <h3 class="fw-bold mb-4"><i class="fa-solid fa-clapperboard text-info me-2"></i>Agregadas recientemente</h3>
    <!-- Skeleton Loader / Mensaje de carga -->
    <div *ngIf="isLoading" class="text-center py-5">
      <div class="spinner-border text-info" role="status">
        <span class="visually-hidden">Cargando...</span>
      </div>
      <p class="mt-3">Cargando catálogo...</p>
    </div>

    <!-- Lista de Películas -->
    <div class="row g-3" *ngIf="!isLoading && peliculas.length > 0">
      <div class="col-6 col-md-4 col-lg-2" *ngFor="let p of peliculas">
        <div class="ml-movie-card position-relative rounded overflow-hidden shadow">
          <!-- OMDb devuelve "N/A" si no tiene póster: fallback a Picsum (sin copyright) -->
          <img [src]="posterDe(p)" alt="{{ p.Title }}" class="w-100" loading="lazy">
          <div class="ml-movie-overlay position-absolute top-0 start-0 w-100 h-100 d-flex flex-column align-items-center justify-content-center p-2 text-center">
            <i class="fa-regular fa-circle-play fa-3x mb-2 text-info"></i>
            <span class="fw-bold fs-6 lh-sm">{{ p.Title }}</span>
            <span class="badge bg-secondary mt-1">{{ p.Year }}</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Estado vacío / error -->
    <div *ngIf="!isLoading && peliculas.length === 0" class="text-center py-5">
      <i class="fa-solid fa-film fa-3x mb-3 text-secondary"></i>
      <p class="mb-0">{{ mensajeError || 'No hay películas para mostrar.' }}</p>
    </div>
  </div>
</div>
